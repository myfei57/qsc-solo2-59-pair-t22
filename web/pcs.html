<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PCS 与 BMS</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 24px; color: #1c2430; }
    section { margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d6dde6; padding: 6px 10px; text-align: left; }
    th { background: #eef3f9; }
    pre { background: #f7f9fc; padding: 10px; overflow-x: auto; }
    .rev { color: #5b6775; font-size: 12px; }
  </style>
</head>
<body>
  <h1>PCS 与 BMS</h1>
  <section>
    <h2>PCS</h2>
    <table>
      <tbody id="pcs"></tbody>
    </table>
    <h3>供电输入</h3>
    <button id="tie">并网</button>
    <button id="off">离网</button>
    <button id="reset">复位跳闸</button>
    <p id="result" class="rev"></p>
  </section>
  <section>
    <h2>BMS</h2>
    <pre id="bms"></pre>
  </section>
  <p class="rev" id="revision"></p>
  <script src="console.js"></script>
  <script>
    async function post(path, body) {
      const response = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body || {})});
      return {status: response.status, payload: await response.json()};
    }
    // PCS 与 BMS 两块取自同一代 view，不会出现"PCS 已并网、BMS 还显示就绪中"。
    const poll = ConsoleData.startPolling((view) => {
      const pcs = view.pcs;
      const rows = [
        ["运行模式", pcs.state], ["迁移代际", pcs.generation], ["降额系数", pcs.derate_ratio],
        ["输出(kW)", pcs.output_kw], ["上网(kW)", pcs.delivered_kw], ["无功(kVar)", pcs.reactive_kvar],
        ["效率", pcs.efficient_at], ["爬坡(kW)", pcs.ramp_kw], ["跳闸", pcs.tripped],
      ];
      document.getElementById("pcs").innerHTML = rows
        .map(([key, value]) => `<tr><th>${key}</th><td>${value}</td></tr>`).join("");
      document.getElementById("bms").textContent = JSON.stringify(view.bms, null, 2);
      document.getElementById("revision").textContent = "数据版本 " + view.revision;
    });
    async function act(path, body, label) {
      const {status, payload} = await post(path, body);
      const node = document.getElementById("result");
      if (status === 400) {
        node.textContent = `${label}被拒绝（请求错误）：${payload.message}`;
      } else if (status === 409) {
        node.textContent = `${label}被拒绝（现场状态不允许）：${payload.message}`;
      } else {
        node.textContent = `${label}已执行（新版本 ${payload.revision}）`;
      }
      poll.tick();
    }
    document.getElementById("tie").onclick = () => act("/api/transfer", {power_kw: 120}, "并网");
    document.getElementById("off").onclick = () => act("/api/off-grid", {}, "离网");
    document.getElementById("reset").onclick = () => act("/api/fire/release", {}, "复位跳闸");
  </script>
</body>
</html>
