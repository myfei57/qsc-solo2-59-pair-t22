<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>告警与审计</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 24px; color: #1c2430; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
    th, td { border: 1px solid #d6dde6; padding: 6px 10px; text-align: left; }
    th { background: #eef3f9; }
    .alarm { color: #b91c1c; font-weight: 600; }
    .warning { color: #b45309; }
  </style>
</head>
<body>
  <h1>告警与审计</h1>
  <h2>簇告警（按最新编号路由）</h2>
  <table>
    <thead><tr><th>编号</th><th>分区</th><th>类型</th><th>级别</th><th>明细</th></tr></thead>
    <tbody id="alerts"></tbody>
  </table>
  <h2>最近审计</h2>
  <table>
    <thead><tr><th>时间</th><th>组件</th><th>动作</th><th>级别</th><th>操作</th></tr></thead>
    <tbody id="audit"></tbody>
  </table>
  <script>
    // 告警表与审计表来自 /api/view/alarms 同一个响应，两表在同一 revision 下
    // 渲染；告警路由依据的簇状态不会比审计更新或更旧。
    async function load() {
      const response = await fetch("/api/view/alarms?limit=30");
      const payload = await response.json();
      if (!response.ok) { return; }
      document.getElementById("alerts").innerHTML = payload.alerts.length
        ? payload.alerts.map((item) =>
            `<tr><td>${item.label}</td><td>${item.zone}</td><td>${item.code}</td>` +
            `<td class="${item.severity}">${item.severity}</td>` +
            `<td>${JSON.stringify(item.detail)}</td></tr>`).join("")
        : `<tr><td colspan="5">当前无告警（快照版本 ${payload.revision}）</td></tr>`;
      document.getElementById("audit").innerHTML = payload.audit.entries
        .map((entry) =>
          `<tr><td>${entry.ts}</td><td>${entry.component}</td><td>${entry.action}</td>` +
          `<td class="${entry.severity}">${entry.severity}</td><td>${entry.payload.op_id || ""}</td></tr>`).join("");
    }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
